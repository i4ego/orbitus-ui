<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbitus-UI</title>
    <link rel="stylesheet" href="{{ url_for('css', path='/styles.css') }}">
    <script src="{{ url_for('js', path='/jquery.min.js') }}"></script>
    <script src="{{ url_for('js', path='/script.js') }}"></script>
</head>
<body>
    <div class="side-panel">
        <a class="title" onclick="window.location.href = '/'">Orbitus UI</a>
        <a class="subtitle">orbitus-service {{ orbitusversion }}</a>
        <div class="buttons">
            <button class="active" onclick="openPage(1)" id="p1">Дэшборд</button>
            <button onclick="openPage(2)" button-data="2" id="p2">Настройки</button>
            <button onclick="openPage(3)" button-data="3" id="p3">О orbitus-ui</button>
            <button class="exit">Выход</button>
        </div>
    </div>
    <div class="pages">
        <div class="page">
            <div class="dashboard">
                <div class="card">
                    <a class="card-title"><img src="{{ url_for('images', path='/success.svg') }}"> Статус</a>
                    <a class="card-content" id="status">{{ status }}</a>
                </div>
                <div class="card">
                    <a class="card-title"><img src="{{ url_for('images', path='/game.svg') }}"> GameFilter</a>
                    <a class="card-content">{{ gf }}</a>
                </div>
                <div class="card">
                    <a class="card-title"><img src="{{ url_for('images', path='/ip.svg') }}"> IPset Filter</a>
                    <a class="card-content">{{ ipsetf }}</a>
                </div>
                <div class="card">
                    <a class="card-title"><img src="{{ url_for('images', path='/config.svg') }}"> Конфигурация</a>
                    <a class="card-content"><small>{{ config }}</small></a>
                </div>
                <div class="card">
                    <a class="card-title"><img src="{{ url_for('images', path='/version.svg') }}"> Версия orbitus-ui</a>
                    <a class="card-content">{{ version }}</a>
                </div>
            </div>
        </div>
        <div class="page">page2</div>
        <div class="page">page3</div>
    </div>
</body>
</html>
